name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - maintenance/v1
      - integration/v2

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check syntax
        run: npm run check:syntax

      - name: Check repository privacy
        run: npm run check:privacy

      - name: Run tests
        run: npm test
